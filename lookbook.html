<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookbook — SOLO PATH</title>
<meta name="description" content="Solo Path Streetwear. Walk your own path.">
<meta name="theme-color" content="#8ed8ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="lookbook">
<div id="site-header"></div>
<main id="top">

  <section class="panel page-hero ph-lilac">
    <p class="pill">Lookbook</p>
    <h1>Drop 01, in colour</h1>
    <p class="lede">Every piece, one stone at a time. Tap a look to see the details.</p>
  </section>
  <section class="panel mock-panel">
    <h2 class="section-title">Front and back</h2>
    <p class="mock-lede">Left-chest embroidery up front, the big print across the back.</p>
    <div class="mock-grid">
      <figure class="mock">
        <img src="images/lookbook/white-tee-walk-alone.jpg" alt="Walk Alone on a white tee, front with embroidered logo and back print" loading="lazy" width="2000" height="1000">
        <figcaption><b>Walk Alone</b> · White tee · embroidered logo on the front, print on the back</figcaption>
      </figure>
      <figure class="mock">
        <img src="images/lookbook/white-tee-one-stone-collage.jpg" alt="One Stone At A Time on a white tee, front with embroidered logo and back print" loading="lazy" width="2000" height="1000">
        <figcaption><b>One Stone At A Time</b> · White tee · embroidered logo on the front, print on the back</figcaption>
      </figure>
      <figure class="mock">
        <img src="images/lookbook/white-tee-long-way-round.jpg" alt="The Long Way Round on a white tee, front with embroidered logo and back print" loading="lazy" width="2000" height="1000">
        <figcaption><b>The Long Way Round</b> · White tee · embroidered logo on the front, print on the back</figcaption>
      </figure>
      <figure class="mock">
        <img src="images/lookbook/black-tee-sun-road.jpg" alt="Sun Road on a black tee, front with embroidered logo and back print" loading="lazy" width="2000" height="1000">
        <figcaption><b>Sun Road</b> · Black tee · embroidered logo on the front, print on the back</figcaption>
      </figure>
    </div>
  </section>
  <section class="panel look-panel">
    <div class="look-grid" id="lookGrid"></div>
  </section>
  <section class="panel drop">
    <div class="drop-inner">
      <div><h2>Wear the path.</h2><p>Found a favourite? Add it to your bag before it's gone.</p></div>
      <a class="btn btn-ink" href="shop.html">Shop the drop</a>
    </div>
  </section>

</main>
<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
